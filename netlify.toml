# Configuration Netlify / Cloudflare Pages.
# Les redirections 301 sont dans public/_redirects (copié tel quel dans dist/).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Le site est généré au format « répertoire » et ses URL canoniques portent un
# slash final. Netlify sert dist/404.html automatiquement sur les chemins
# non résolus : aucune règle de repli n'est nécessaire ici.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
